language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
      - main

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/prisma/migrations/**"
    - "!**/*.lock"
    - "!**/.env*"

  path_instructions:
    - path: "server/**"
      instructions: |
        This is a Node.js/Express 5 backend using CommonJS (require/module.exports).
        Key conventions:
        - Always use catchAsync wrapper for async route handlers
        - Use errors.* helpers (errors.badRequest, errors.notFound etc.) not raw Error
        - French UI strings for all user-facing messages
        - Cookie-only auth — never Bearer tokens
        - PawaPay description field max 22 characters
        - Prisma is the only DB client — no raw SQL
        - Fire-and-forget notifications with .catch(() => {})

    - path: "seller/**"
      instructions: |
        This is a Next.js 15 + TypeScript seller dashboard.
        Key conventions:
        - TanStack Query for all data fetching
        - shadcn/ui + Tailwind CSS for UI
        - Cookie-based auth synced with SwiftGoma API
        - French UI strings for all user-facing text

    - path: "buyer/**"
      instructions: |
        This is a Flutter buyer app using Riverpod for state management.
        Key conventions:
        - GoRouter for navigation
        - Dio for HTTP requests
        - French UI strings for all user-facing text

    - path: "deliverer/**"
      instructions: |
        This is a Flutter deliverer app using Riverpod for state management.
        Key conventions:
        - GoRouter for navigation
        - Dio + Socket.io for real-time GPS broadcast
        - French UI strings for all user-facing text

chat:
  auto_reply: true
