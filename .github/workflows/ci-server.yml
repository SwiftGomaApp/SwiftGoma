name: CI — Backend

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"

jobs:
  lint-and-check:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "backend/.nvmrc"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check syntax (all JS files)
        run: find src -name "*.js" | xargs node --check

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/swiftgoma_test_v1

      - name: Check PawaPay webhook signature verification is present
        run: |
          WEBHOOK_FILE=$(grep -rl "pawapay" src/features --include="*.js" -i | xargs grep -l "webhook" -i || true)
          if [ -z "$WEBHOOK_FILE" ]; then
            echo "::warning::No PawaPay webhook handler file matched — skipping signature check."
            exit 0
          fi
          if ! grep -qi "signature" $WEBHOOK_FILE; then
            echo "::error::PawaPay webhook handler(s) found with no signature verification: $WEBHOOK_FILE"
            exit 1
          fi
          echo "Signature verification reference found in: $WEBHOOK_FILE"

  pawapay-connectivity:
    name: PawaPay Sandbox Connectivity
    runs-on: ubuntu-latest
    needs: lint-and-check
    # Skip on PRs from forks, since the secret isn't exposed to them
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Verify PAWAPAY_SANDBOX_API_TOKEN is set
        run: |
          if [ -z "${{ secrets.PAWAPAY_SANDBOX_API_TOKEN }}" ]; then
            echo "::error::PAWAPAY_SANDBOX_API_TOKEN secret is not set in this repo/environment."
            exit 1
          fi

      - name: Check active configuration + DRC corridors
        env:
          PAWAPAY_SANDBOX_API_TOKEN: ${{ secrets.PAWAPAY_SANDBOX_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --request GET \
            --url https://api.sandbox.pawapay.io/active-conf \
            --header "Authorization: Bearer $PAWAPAY_SANDBOX_API_TOKEN")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::PawaPay active-conf check failed with HTTP $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          echo "PawaPay sandbox token is valid. Active configuration:"
          echo "$BODY" | jq .

          # Fail if none of the expected DRC correspondents are active on this account
          for CODE in ORANGE_COD AIRTEL_COD VODACOM_MPESA_COD; do
            if ! echo "$BODY" | jq -e --arg code "$CODE" \
              '.countries[]?.correspondents[]? | select(.correspondent == $code)' > /dev/null; then
              echo "::warning::Expected correspondent $CODE not found in active configuration."
            fi
          done
