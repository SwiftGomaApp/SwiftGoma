name: Flutter CI

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/buyer/**"
      - "apps/seller/**"
      - "apps/delivery/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/buyer/**"
      - "apps/seller/**"
      - "apps/delivery/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [buyer, seller, delivery]

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
