name: Flutter CI

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/buyer/**"
      - "apps/seller/**"
      - "apps/delivery/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/buyer/**"
      - "apps/seller/**"
      - "apps/delivery/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [buyer, seller, delivery]

    defaults:
      run:
        working-directory: apps/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Check app is scaffolded
        id: scaffolded
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/${{ matrix.app }} has no pubspec.yaml yet — skipping pub get/analyze/test until the app is scaffolded."
          fi

      - name: Install dependencies
        if: steps.scaffolded.outputs.exists == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.scaffolded.outputs.exists == 'true'
        run: flutter analyze

      - name: Run tests
        if: steps.scaffolded.outputs.exists == 'true'
        run: flutter test
