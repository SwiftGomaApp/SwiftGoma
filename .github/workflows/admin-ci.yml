name: Admin CI

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/admin/**"
      - ".github/workflows/admin-ci.yml"

defaults:
  run:
    working-directory: apps/admin

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder — le build Next.js a besoin de cette variable définie
      # pour ne pas planter si du code appelle process.env.API_URL au
      # moment du build (server components, metadata, etc.). Pas une vraie
      # connexion réseau pendant le build, juste une valeur non-vide requise.
      API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json

      - name: Check app is scaffolded
        id: scaffolded
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::apps/admin has no package.json yet — skipping install/lint/build until the app is scaffolded."
          fi

      - name: Install dependencies
        if: steps.scaffolded.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.scaffolded.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.scaffolded.outputs.exists == 'true'
        run: npx tsc --noEmit --if-present

      - name: Build
        if: steps.scaffolded.outputs.exists == 'true'
        run: npm run build
