name: Web CI

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: apps/web

jobs:
  lint-and-build-web:
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # These match what lib/api/client.ts, lib/api/get-server-user.ts,
      # lib/socket.ts, lib/onesignal.ts, and the Google auth components
      # actually read. None of them hard-fail the build if unset (they all
      # fall back to a default or a console warning), but CI provides real
      # placeholder values anyway so `next build` never depends on that
      # fallback path silently masking a real misconfiguration later.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-test-client-id.apps.googleusercontent.com
      NEXT_PUBLIC_ONESIGNAL_APP_ID: ci-test-onesignal-app-id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        # --if-present: no-ops instead of failing — no test runner is
        # configured for this app yet.
        run: npm test --if-present

      - name: Build
        run: npm run build
