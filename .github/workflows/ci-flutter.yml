name: CI — Flutter Apps

on:
  push:
    branches: [dev, main]
    paths:
      - "buyer/**"
      - "deliverer/**"
  pull_request:
    branches: [dev]
    paths:
      - "buyer/**"
      - "deliverer/**"

jobs:
  analyze-buyer:
    name: Analyze — Buyer App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: buyer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

  analyze-deliverer:
    name: Analyze — Deliverer App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deliverer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
